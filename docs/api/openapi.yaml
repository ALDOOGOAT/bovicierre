openapi: 3.1.0
info:
  title: BoviCierre API
  version: 0.1.0
  summary: Contrato inicial del MVP (diseño; ninguna operación implementada aún).
  description: |
    Reglas transversales:
    - Importes y pesos se envían como cadenas decimales (`"240000.00"`, `"5000.000"`), con moneda/unidad explícitas.
    - El servidor calcula todos los totales; nunca acepta totales del navegador.
    - Comandos con efecto exigen `Idempotency-Key`; ediciones de borrador exigen `If-Match` (version_lock).
    - Scope (empresa/sede) se deriva de la sesión y se verifica; el cliente no elige nodo ni credenciales.
    - Errores: 401 sin sesión, 403 sin permiso, 404 recurso no accesible, 409 conflicto/idempotencia,
      422 regla de dominio, 503 nodo dueño no disponible.
    - Todos los ejemplos son datos sintéticos.
  license:
    name: Propietario (proyecto académico)
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sesion: []
tags:
  - name: sesion
  - name: catalogos
  - name: identidad
  - name: operaciones
  - name: pesajes
  - name: reservas
  - name: inventario
  - name: liquidaciones
  - name: costos
  - name: pagos
  - name: reportes
  - name: evidencia
  - name: integraciones
paths:
  /sesion/login:
    post:
      tags: [sesion]
      operationId: login
      security: []
      summary: Inicia sesión (cookie HttpOnly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, contrasena]
              properties:
                login: { type: string, maxLength: 80 }
                contrasena: { type: string, format: password }
      responses:
        '204': { description: Sesión creada (Set-Cookie) }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '503': { $ref: '#/components/responses/DuenoNoDisponible' }
  /sesion/logout:
    post:
      tags: [sesion]
      operationId: logout
      summary: Logout
      parameters: [ { $ref: '#/components/parameters/CsrfToken' } ]
      responses:
        '204': { description: Sesión cerrada }
  /sesion/actual:
    get:
      tags: [sesion]
      operationId: sesionActual
      summary: Usuario actual, sedes y capacidades autorizadas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionActual' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /sedes/{sedeId}/contrapartes:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    get:
      tags: [catalogos]
      operationId: listarContrapartes
      summary: Listar contrapartes
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      elementos: { type: array, items: { $ref: '#/components/schemas/Contraparte' } }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [catalogos]
      operationId: crearContraparte
      summary: Crear contraparte
      description: Escritura maestra; se ejecuta en el nodo A.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContraparteNueva' }
      responses:
        '201':
          description: Creada
          content: { application/json: { schema: { $ref: '#/components/schemas/Contraparte' } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaDominio' }
        '503': { $ref: '#/components/responses/DuenoNoDisponible' }
  /sedes/{sedeId}/animales:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    post:
      tags: [identidad]
      operationId: registrarIdentidadAnimal
      summary: Registrar identidad animal
      description: Ejecutado en el maestro A. Si la sede es B, la respuesta indica PENDIENTE_CONVERGENCIA hasta que la identidad sea visible en B.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sexo, identificaciones]
              properties:
                sexo: { type: string, enum: [M, H] }
                fecha_nacimiento_declarada: { type: string, format: date }
                identificaciones:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sistema, codigo]
                    properties:
                      sistema: { type: string, enum: [SINIIGA, SINIDA, INTERNO, OTRO] }
                      codigo: { type: string, maxLength: 40, examples: ['DEMO-000123'] }
      responses:
        '201':
          description: Registrado
          content: { application/json: { schema: { $ref: '#/components/schemas/Animal' } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503': { $ref: '#/components/responses/DuenoNoDisponible' }
  /sedes/{sedeId}/animales/{animalId}:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: animalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [identidad]
      operationId: fichaAnimal
      summary: Ficha animal
      responses:
        '200':
          description: Ficha con ciclos históricos
          content: { application/json: { schema: { $ref: '#/components/schemas/FichaAnimal' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /sedes/{sedeId}/operaciones:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    get:
      tags: [operaciones]
      operationId: bandejaOperaciones
      summary: Bandeja operaciones
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoOperacion' } }
        - { name: tipo, in: query, schema: { type: string, enum: [COMPRA, VENTA] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      elementos: { type: array, items: { $ref: '#/components/schemas/OperacionResumen' } }
    post:
      tags: [operaciones]
      operationId: crearBorrador
      summary: Crear borrador
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, parte_id, fecha_operacion]
              properties:
                tipo: { type: string, enum: [COMPRA, VENTA] }
                parte_id: { type: string, format: uuid }
                fecha_operacion: { type: string, format: date }
      responses:
        '201':
          description: Borrador creado
          headers: { ETag: { schema: { type: string }, description: version_lock } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Operacion' } } }
  /sedes/{sedeId}/operaciones/{operacionId}:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/OperacionId' } ]
    get:
      tags: [operaciones]
      operationId: obtenerOperacion
      summary: Obtener operacion
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Operacion' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [operaciones]
      operationId: editarBorrador
      summary: Editar borrador
      description: Edita lotes, selecciones y condiciones de la versión en curso. Sólo BORRADOR/ACORDADA.
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdicionBorrador' }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Operacion' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/operaciones/{operacionId}/confirmar:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/OperacionId' } ]
    post:
      tags: [operaciones]
      operationId: confirmarOperacion
      summary: Confirmar operacion
      description: ConfirmarCompra o ConfirmarVenta según el tipo (RN-021, RN-022). Atómico.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfToken' } ]
      responses:
        '200':
          description: Confirmada (o resultado previo si es reintento con la misma clave y payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liquidacion' }
              examples:
                gold01Compra:
                  value:
                    id: 0192f0a0-0000-7000-8000-000000000001
                    operacion_id: 0192f0a0-0000-7000-8000-0000000000c1
                    direccion: POR_PAGAR
                    total: { importe: '240000.00', moneda: MXN }
                    saldo: { importe: '240000.00', moneda: MXN }
                    conceptos:
                      - { numero: 1, tipo: BASE, cantidad: '5000.000', unidad: KG, precio_unitario: '48.0000', importe: { importe: '240000.00', moneda: MXN } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaDominio' }
        '503': { $ref: '#/components/responses/DuenoNoDisponible' }
  /sedes/{sedeId}/operaciones/{operacionId}/pesajes:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/OperacionId' } ]
    post:
      tags: [pesajes]
      operationId: proponerPesaje
      summary: Proponer pesaje
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PesajeNuevo' } } }
      responses:
        '201': { description: Propuesto, content: { application/json: { schema: { $ref: '#/components/schemas/Pesaje' } } } }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/pesajes/{pesajeId}/aprobar:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: pesajeId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [pesajes]
      operationId: aprobarPesaje
      summary: Aprobar pesaje
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      responses:
        '200': { description: Aprobado y composición congelada, content: { application/json: { schema: { $ref: '#/components/schemas/Pesaje' } } } }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/pesajes/{pesajeId}/correcciones:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: pesajeId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [pesajes]
      operationId: corregirPesaje
      summary: Corregir pesaje
      description: Crea un nuevo pesaje que corrige al original (no lo edita).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PesajeNuevo' } } }
      responses:
        '201': { description: Corrección registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Pesaje' } } } }
  /sedes/{sedeId}/operaciones/{operacionId}/reservas:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/OperacionId' } ]
    post:
      tags: [reservas]
      operationId: reservarPosiciones
      summary: Reservar posiciones
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posiciones, vence_en]
              properties:
                posiciones: { type: array, minItems: 1, items: { type: string, format: uuid } }
                vence_en: { type: string, format: date-time }
      responses:
        '201':
          description: Reservas activas
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reserva' } } } }
        '409':
          description: Posición no disponible (otra reserva activa o vendida)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: BV402, mensaje: 'La posición ya está reservada por otra venta.', regla_id: RN-018, correlation_id: 0192f0a0-0000-7000-8000-00000000ffff, campos: [] }
  /sedes/{sedeId}/reservas/{reservaId}/liberar:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: reservaId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [reservas]
      operationId: liberarReserva
      summary: Liberar reserva
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      responses:
        '200': { description: Liberada, content: { application/json: { schema: { $ref: '#/components/schemas/Reserva' } } } }
  /sedes/{sedeId}/inventario/posiciones:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    get:
      tags: [inventario]
      operationId: listarPosiciones
      summary: Listar posiciones
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoPosicion' } }
        - { name: disponibles_para_venta, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      elementos: { type: array, items: { $ref: '#/components/schemas/Posicion' } }
  /sedes/{sedeId}/inventario/movimientos:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    post:
      tags: [inventario]
      operationId: registrarMovimiento
      summary: Registrar movimiento
      description: Recepción, entrega o baja. No genera venta, costo ni obligación (RN-020).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, posiciones, ocurrido_en]
              properties:
                tipo: { type: string, enum: [RECEPCION, ENTREGA, BAJA] }
                motivo_baja: { type: string, enum: [PERDIDA, MUERTE] }
                posiciones: { type: array, minItems: 1, items: { type: string, format: uuid } }
                ocurrido_en: { type: string, format: date-time }
                documento_id: { type: string, format: uuid }
      responses:
        '201': { description: Registrado }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/liquidaciones/{liquidacionId}:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/LiquidacionId' } ]
    get:
      tags: [liquidaciones]
      operationId: detalleLiquidacion
      summary: Detalle liquidacion
      responses:
        '200': { description: 'Snapshot, ajustes, aplicaciones y saldo', content: { application/json: { schema: { $ref: '#/components/schemas/Liquidacion' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /sedes/{sedeId}/liquidaciones/{liquidacionId}/ajustes:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/LiquidacionId' } ]
    post:
      tags: [liquidaciones]
      operationId: ajustarLiquidacion
      summary: Ajustar liquidacion
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naturaleza, monto, motivo, fuente]
              properties:
                naturaleza: { type: string, enum: [CARGO, ABONO] }
                monto: { $ref: '#/components/schemas/Dinero' }
                motivo: { type: string, maxLength: 200 }
                fuente: { type: string, enum: [PRECIO_GANADO, BONIFICACION_COMERCIAL, OTRO] }
                reaplicar_pagos: { type: boolean, description: 'Si la obligación queda por debajo de lo aplicado, revierte y reaplica (GOLD-07).' }
      responses:
        '201': { description: Ajuste registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Liquidacion' } } } }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/liquidaciones/{liquidacionId}/comprobante:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/LiquidacionId' } ]
    get:
      tags: [liquidaciones]
      operationId: comprobanteInterno
      summary: Comprobante interno
      description: PDF interno (no es CFDI). No genera ningún hecho económico.
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
  /sedes/{sedeId}/gastos:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    post:
      tags: [costos]
      operationId: registrarGasto
      summary: Registrar gasto
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GastoNuevo' } } }
      responses:
        '201': { description: Registrado (BORRADOR) }
  /sedes/{sedeId}/gastos/{gastoId}/reparto:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: gastoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [costos]
      operationId: previsualizarReparto
      summary: Previsualizar reparto
      parameters: [ { name: metodo, in: query, required: true, schema: { type: string, enum: [POR_CABEZA, POR_PESO_MEDIDO, IMPORTE_INDIVIDUAL] } } ]
      responses:
        '200': { description: Asignaciones propuestas (sin persistir), content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Asignacion' } } } } }
    post:
      tags: [costos]
      operationId: aprobarReparto
      summary: Aprobar reparto
      description: Aprueba el gasto y crea asignaciones y asientos según destino económico (incluye costos tardíos).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [metodo], properties: { metodo: { type: string, enum: [POR_CABEZA, POR_PESO_MEDIDO, IMPORTE_INDIVIDUAL] } } } } }
      responses:
        '201': { description: Aprobado }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/pagos:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    post:
      tags: [pagos]
      operationId: registrarPago
      summary: Registrar pago
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PagoNuevo' } } }
      responses:
        '201': { description: Registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } } }
  /sedes/{sedeId}/pagos/{pagoId}/aplicaciones:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/PagoId' } ]
    post:
      tags: [pagos]
      operationId: aplicarPago
      summary: Aplicar pago
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aplicaciones]
              properties:
                aplicaciones:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [liquidacion_id, importe]
                    properties:
                      liquidacion_id: { type: string, format: uuid }
                      importe: { $ref: '#/components/schemas/Dinero' }
      responses:
        '201': { description: Aplicado, content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } } }
        '422':
          description: Excede disponible o saldo (RN-029)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: BV020, mensaje: 'El importe excede el saldo de la obligación (400.00 MXN).', regla_id: RN-029, correlation_id: 0192f0a0-0000-7000-8000-00000000eeee, campos: [ { campo: 'aplicaciones[0].importe', problema: excede_saldo } ] }
        '409': { $ref: '#/components/responses/Conflicto' }
  /sedes/{sedeId}/aplicaciones/{aplicacionId}/reverso:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: aplicacionId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [pagos]
      operationId: revertirAplicacion
      summary: Revertir aplicacion
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [motivo], properties: { motivo: { type: string, maxLength: 200 } } } } }
      responses:
        '201': { description: Reverso completo registrado }
        '409': { $ref: '#/components/responses/Conflicto' }
  /sedes/{sedeId}/pagos/{pagoId}/reembolsos:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { $ref: '#/components/parameters/PagoId' } ]
    post:
      tags: [pagos]
      operationId: registrarReembolso
      summary: Registrar reembolso
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [importe, recibido_el], properties: { importe: { $ref: '#/components/schemas/Dinero' }, recibido_el: { type: string, format: date } } } } }
      responses:
        '201': { description: Reembolso registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } } }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/reportes/cartera:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    get:
      tags: [reportes]
      operationId: reporteCartera
      summary: Reporte cartera
      parameters:
        - { name: direccion, in: query, schema: { type: string, enum: [POR_COBRAR, POR_PAGAR] } }
        - { name: vencida, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cartera con corte, content: { application/json: { schema: { $ref: '#/components/schemas/ReporteCartera' } } } }
  /sedes/{sedeId}/reportes/margen:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    get:
      tags: [reportes]
      operationId: reporteMargen
      summary: Reporte margen
      parameters:
        - { name: operacion_id, in: query, schema: { type: string, format: uuid } }
        - { name: periodo_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Margen etiquetado PROVISIONAL/ACTUALIZADO/CERRADO, content: { application/json: { schema: { $ref: '#/components/schemas/ReporteMargen' } } } }
  /sedes/{sedeId}/periodos/{periodoId}/cierre:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: periodoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [reportes]
      operationId: cerrarPeriodo
      summary: Cerrar periodo
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      responses:
        '201': { description: Versión de cierre creada }
        '409': { $ref: '#/components/responses/Conflicto' }
  /sedes/{sedeId}/documentos:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    post:
      tags: [evidencia]
      operationId: subirDocumento
      summary: Subir documento
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, tipo_documental]
              properties:
                archivo: { type: string, format: binary, description: 'PDF/JPEG/PNG, máx. 20 MiB; MIME real validado.' }
                tipo_documental: { type: string, enum: [TICKET_BASCULA, CONTRATO, GUIA_MOVILIZACION, COMPROBANTE_PAGO, IDENTIFICACION, OTRO] }
                documento_previo_id: { type: string, format: uuid }
      responses:
        '201': { description: Documento (metadatos y sha256), content: { application/json: { schema: { $ref: '#/components/schemas/Documento' } } } }
        '422': { $ref: '#/components/responses/ReglaDominio' }
  /sedes/{sedeId}/documentos/{documentoId}/contenido:
    parameters: [ { $ref: '#/components/parameters/SedeId' }, { name: documentoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [evidencia]
      operationId: descargarDocumento
      summary: Descargar documento
      responses:
        '200': { description: Contenido autorizado, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /sedes/{sedeId}/integraciones/proveedor/tarifas:
    parameters: [ { $ref: '#/components/parameters/SedeId' } ]
    get:
      tags: [integraciones]
      operationId: consultarTarifasProveedor
      summary: Consultar tarifas proveedor
      description: Consulta FDW al proveedor SIMULADO (datos sintéticos). Fuera de transacciones con locks.
      parameters: [ { name: ruta, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Tarifas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TarifaExterna' } } } } }
        '503': { $ref: '#/components/responses/DuenoNoDisponible' }
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: BOVI_SESSION
  parameters:
    SedeId: { name: sedeId, in: path, required: true, schema: { type: string, format: uuid } }
    OperacionId: { name: operacionId, in: path, required: true, schema: { type: string, format: uuid } }
    LiquidacionId: { name: liquidacionId, in: path, required: true, schema: { type: string, format: uuid } }
    PagoId: { name: pagoId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 80 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: version_lock recibido en ETag }
    CsrfToken: { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
    Pagina: { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Tamano: { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    NoAutenticado: { description: Sin sesión, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
    SinPermiso: { description: Sin permiso para la sede o la acción, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NoEncontrado: { description: No existe o no es accesible (política uniforme), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflicto:
      description: Conflicto de concurrencia, version_lock o idempotencia (misma clave, payload distinto)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { codigo: BV405, mensaje: 'La clave de idempotencia ya se usó con otro contenido.', regla_id: RN-032, correlation_id: 0192f0a0-0000-7000-8000-00000000dddd, campos: [] }
    ReglaDominio: { description: Viola una regla de negocio, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
    DuenoNoDisponible:
      description: El nodo dueño no está disponible; la escritura no se confirmó
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { codigo: BV501, mensaje: 'La sede no está disponible; la operación no se registró. Reintente más tarde.', regla_id: RN-041, correlation_id: 0192f0a0-0000-7000-8000-00000000cccc, campos: [] }
  schemas:
    Decimal2: { type: string, pattern: '^-?\d{1,16}\.\d{2}$', examples: ['240000.00'] }
    Decimal3: { type: string, pattern: '^\d{1,11}\.\d{3}$', examples: ['5000.000'] }
    Decimal4: { type: string, pattern: '^\d{1,10}\.\d{4}$', examples: ['48.0000'] }
    Dinero:
      type: object
      required: [importe, moneda]
      properties:
        importe: { $ref: '#/components/schemas/Decimal2' }
        moneda: { type: string, enum: [MXN] }
    Peso:
      type: object
      required: [kg]
      properties:
        kg: { $ref: '#/components/schemas/Decimal3' }
    Error:
      type: object
      required: [codigo, mensaje, correlation_id]
      properties:
        codigo: { type: string, examples: [BV402] }
        mensaje: { type: string }
        regla_id: { type: string, examples: [RN-018] }
        correlation_id: { type: string, format: uuid }
        campos:
          type: array
          items: { type: object, properties: { campo: { type: string }, problema: { type: string } } }
    Pagina:
      type: object
      required: [pagina, tamano, total]
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
    SesionActual:
      type: object
      properties:
        usuario: { type: object, properties: { id: { type: string, format: uuid }, nombre: { type: string } } }
        sedes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              codigo: { type: string }
              nombre: { type: string }
              roles: { type: array, items: { type: string, enum: [ADMIN, OPERADOR, CAJA, AUDITOR] } }
              disponible: { type: boolean, description: Nodo dueño alcanzable }
    ContraparteNueva:
      type: object
      required: [tipo_persona, nombre]
      properties:
        tipo_persona: { type: string, enum: [FISICA, MORAL] }
        nombre: { type: string, maxLength: 200 }
        rfc: { type: string, maxLength: 13 }
        telefono: { type: string, maxLength: 20 }
    Contraparte:
      allOf:
        - $ref: '#/components/schemas/ContraparteNueva'
        - type: object
          properties: { id: { type: string, format: uuid }, es_sintetico: { type: boolean } }
    Animal:
      type: object
      properties:
        id: { type: string, format: uuid }
        sede_operadora_id: { type: string, format: uuid }
        situacion: { type: string, enum: [VIGENTE, IDENTIDAD_EN_REVISION, MUERTO] }
        estado_convergencia: { type: string, enum: [VISIBLE, PENDIENTE_CONVERGENCIA] }
        identificaciones:
          type: array
          items: { type: object, properties: { sistema: { type: string }, codigo_declarado: { type: string }, estado: { type: string } } }
    FichaAnimal:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          properties:
            ciclos: { type: array, items: { $ref: '#/components/schemas/Posicion' } }
    EstadoOperacion: { type: string, enum: [BORRADOR, ACORDADA, CONFIRMADA, CANCELADA, ANULADA] }
    EstadoPosicion: { type: string, enum: [PENDIENTE_RECEPCION, DISPONIBLE, VENDIDA_PENDIENTE_ENTREGA, CERRADA_VENTA, BAJA] }
    OperacionResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [COMPRA, VENTA] }
        folio: { type: string }
        contraparte: { type: string }
        estado: { $ref: '#/components/schemas/EstadoOperacion' }
        estado_entrega: { type: string, enum: [PENDIENTE, PARCIAL, COMPLETA] }
        pendientes: { type: array, items: { type: string, enum: [PESAJE, LIQUIDACION, ENTREGA, PAGO, DOCUMENTO] } }
    Operacion:
      allOf:
        - $ref: '#/components/schemas/OperacionResumen'
        - type: object
          properties:
            version_lock: { type: integer }
            lotes:
              type: array
              items:
                type: object
                properties:
                  numero_lote: { type: integer }
                  animales: { type: array, items: { type: string, format: uuid } }
                  posiciones: { type: array, items: { type: string, format: uuid } }
            version_en_curso: { $ref: '#/components/schemas/Version' }
    Version:
      type: object
      properties:
        numero_version: { type: integer }
        estado: { type: string, enum: [PROPUESTA, ACEPTADA, SUPERADA] }
        condiciones:
          type: array
          items:
            type: object
            required: [numero_lote, unidad_precio, precio_unitario]
            properties:
              numero_lote: { type: integer }
              unidad_precio: { type: string, enum: [KG, CABEZA] }
              precio_unitario: { $ref: '#/components/schemas/Decimal4' }
              pesaje_base_id: { type: string, format: uuid }
              deduccion_pct: { type: string, pattern: '^\d{1,2}\.\d{1,6}$' }
    EdicionBorrador:
      type: object
      properties:
        lotes: { type: array, items: { type: object } }
        version: { $ref: '#/components/schemas/Version' }
        acordar: { type: boolean }
    PesajeNuevo:
      type: object
      required: [numero_lote, modo, neto, pesado_en, animales]
      properties:
        numero_lote: { type: integer }
        modo: { type: string, enum: [BRUTO_TARA, NETO_REPORTADO] }
        bruto: { $ref: '#/components/schemas/Peso' }
        tara: { $ref: '#/components/schemas/Peso' }
        neto: { $ref: '#/components/schemas/Peso' }
        ticket_folio: { type: string }
        pesado_en: { type: string, format: date-time }
        documento_id: { type: string, format: uuid }
        animales:
          type: array
          items:
            type: object
            required: [animal_id]
            properties:
              animal_id: { type: string, format: uuid }
              peso_individual: { $ref: '#/components/schemas/Peso' }
    Pesaje:
      allOf:
        - $ref: '#/components/schemas/PesajeNuevo'
        - type: object
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [PROPUESTA, APROBADO, CORREGIDO] }
            fuente: { type: string, enum: [MANUAL, CSV, OCR, FDW] }
    Reserva:
      type: object
      properties:
        id: { type: string, format: uuid }
        posicion_id: { type: string, format: uuid }
        estado: { type: string, enum: [ACTIVA, CONSUMIDA, LIBERADA, EXPIRADA] }
        vence_en: { type: string, format: date-time }
    Posicion:
      type: object
      properties:
        id: { type: string, format: uuid }
        animal_id: { type: string, format: uuid }
        numero_ciclo: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoPosicion' }
        reservada: { type: boolean, description: Derivado de una reserva ACTIVA }
        costo_vigente: { $ref: '#/components/schemas/Dinero' }
    Liquidacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        operacion_id: { type: string, format: uuid }
        direccion: { type: string, enum: [POR_PAGAR, POR_COBRAR] }
        total: { $ref: '#/components/schemas/Dinero' }
        ajustes_cargo: { $ref: '#/components/schemas/Dinero' }
        ajustes_abono: { $ref: '#/components/schemas/Dinero' }
        aplicaciones_netas: { $ref: '#/components/schemas/Dinero' }
        saldo: { $ref: '#/components/schemas/Dinero' }
        vence_el: { type: string, format: date }
        conceptos:
          type: array
          items:
            type: object
            properties:
              numero: { type: integer }
              tipo: { type: string, enum: [BASE, CARGO, BONIFICACION, DEDUCCION] }
              cantidad: { type: string }
              unidad: { type: string, enum: [KG, CABEZA, MXN] }
              precio_unitario: { $ref: '#/components/schemas/Decimal4' }
              importe: { $ref: '#/components/schemas/Dinero' }
    GastoNuevo:
      type: object
      required: [operacion_id, naturaleza, clasificacion, importe, concepto, fecha_economica]
      properties:
        operacion_id: { type: string, format: uuid }
        naturaleza: { type: string, enum: [COSTO, BONIFICACION] }
        clasificacion: { type: string, enum: [CAPITALIZABLE, DIRECTO_VENTA, OTRO] }
        importe: { $ref: '#/components/schemas/Dinero' }
        concepto: { type: string, maxLength: 160 }
        proveedor_parte_id: { type: string, format: uuid }
        referencia_origen: { type: string, maxLength: 60 }
        bonifica_gasto_id: { type: string, format: uuid }
        fecha_economica: { type: string, format: date }
    Asignacion:
      type: object
      properties:
        posicion_id: { type: string, format: uuid }
        base_valor: { type: string }
        importe: { $ref: '#/components/schemas/Dinero' }
        destino: { type: string, enum: [INVENTARIO, COSTO_VENTA, PERDIDA] }
    PagoNuevo:
      type: object
      required: [parte_id, tipo, importe, metodo, recibido_el]
      properties:
        parte_id: { type: string, format: uuid }
        tipo: { type: string, enum: [COBRO, PAGO] }
        importe: { $ref: '#/components/schemas/Dinero' }
        metodo: { type: string, enum: [TRANSFERENCIA, EFECTIVO, CHEQUE, OTRO] }
        referencia: { type: string, maxLength: 60 }
        recibido_el: { type: string, format: date }
    Pago:
      allOf:
        - $ref: '#/components/schemas/PagoNuevo'
        - type: object
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [REGISTRADO, VALIDADO, REVERTIDO] }
            aplicado: { $ref: '#/components/schemas/Dinero' }
            reembolsado: { $ref: '#/components/schemas/Dinero' }
            disponible: { $ref: '#/components/schemas/Dinero' }
    Documento:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo_documental: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        tamano_bytes: { type: integer }
        mime: { type: string }
        version: { type: integer }
    ReporteCartera:
      type: object
      properties:
        corte_en: { type: string, format: date-time }
        antiguedad_replica_segundos: { type: integer, description: 'null si los datos son del nodo dueño' }
        filas:
          type: array
          items:
            type: object
            properties:
              liquidacion_id: { type: string, format: uuid }
              contraparte: { type: string }
              saldo: { $ref: '#/components/schemas/Dinero' }
              vence_el: { type: string, format: date }
              dias_vencida: { type: integer }
    ReporteMargen:
      type: object
      properties:
        corte_en: { type: string, format: date-time }
        etiqueta: { type: string, enum: [PROVISIONAL, ACTUALIZADO, CERRADO] }
        venta_neta: { $ref: '#/components/schemas/Dinero' }
        costo_vendido: { $ref: '#/components/schemas/Dinero' }
        gastos_directos: { $ref: '#/components/schemas/Dinero' }
        margen: { $ref: '#/components/schemas/Dinero' }
        perdidas: { $ref: '#/components/schemas/Dinero' }
        faltantes: { type: array, items: { type: string } }
    TarifaExterna:
      type: object
      properties:
        fuente: { type: string, examples: ['Proveedor Simulado (sintético)'] }
        ruta: { type: string }
        precio: { $ref: '#/components/schemas/Decimal4' }
        unidad: { type: string }
        vigente_desde: { type: string, format: date }
        version: { type: integer }

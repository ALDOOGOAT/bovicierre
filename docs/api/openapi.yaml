openapi: 3.1.0
info:
  title: BoviCierre API
  version: 0.2.0
  summary: Contrato de implementación local; evidencia de operaciones disponibles registrada por incremento.
  description: "Reglas transversales:\n- Importes y pesos se envían como cadenas decimales (`\"240000.00\"\
    `, `\"5000.000\"`), con moneda/unidad explícitas.\n- El servidor calcula todos los totales; nunca\
    \ acepta totales del navegador.\n- Comandos con efecto exigen `Idempotency-Key`; ediciones de borrador\
    \ exigen `If-Match` (version_lock).\n- Scope (empresa/sede) se deriva de la sesión y se verifica;\
    \ el cliente no elige nodo ni credenciales.\n- Errores: 401 sin sesión, 403 sin permiso, 404 recurso\
    \ no accesible, 409 conflicto/idempotencia,\n  422 regla de dominio, 503 nodo dueño no disponible.\n\
    - Todos los ejemplos son datos sintéticos.\n"
  license:
    name: Propietario (proyecto académico)
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
security:
- sesion: []
tags:
- name: sesion
  description: Operaciones de sesion con autorización por sede.
- name: catalogos
  description: Operaciones de catalogos con autorización por sede.
- name: identidad
  description: Operaciones de identidad con autorización por sede.
- name: operaciones
  description: Operaciones de operaciones con autorización por sede.
- name: pesajes
  description: Operaciones de pesajes con autorización por sede.
- name: reservas
  description: Operaciones de reservas con autorización por sede.
- name: inventario
  description: Operaciones de inventario con autorización por sede.
- name: liquidaciones
  description: Operaciones de liquidaciones con autorización por sede.
- name: costos
  description: Operaciones de costos con autorización por sede.
- name: pagos
  description: Operaciones de pagos con autorización por sede.
- name: reportes
  description: Operaciones de reportes con autorización por sede.
- name: evidencia
  description: Operaciones de evidencia con autorización por sede.
- name: integraciones
  description: Operaciones de integraciones con autorización por sede.
paths:
  /sesion/login:
    post:
      tags:
      - sesion
      operationId: login
      security: []
      summary: Inicia sesión (cookie HttpOnly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - contrasena
              properties:
                login:
                  type: string
                  maxLength: 80
                contrasena:
                  type: string
                  format: password
      responses:
        '204':
          description: Sesión creada (Set-Cookie)
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '422':
          $ref: '#/components/responses/ReglaDominio'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /sesion/logout:
    post:
      tags:
      - sesion
      operationId: logout
      summary: Logout
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '422':
          $ref: '#/components/responses/ReglaDominio'
  /sesion/actual:
    get:
      tags:
      - sesion
      operationId: sesionActual
      summary: Usuario actual, sedes y capacidades autorizadas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
  /sedes/{sedeId}/contrapartes:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    get:
      tags:
      - catalogos
      operationId: listarContrapartes
      summary: Listar contrapartes
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    elementos:
                      type: array
                      items:
                        $ref: '#/components/schemas/Contraparte'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - catalogos
      operationId: crearContraparte
      summary: Crear contraparte
      description: Escritura maestra; se ejecuta en el nodo A.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContraparteNueva'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contraparte'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/animales:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    post:
      tags:
      - identidad
      operationId: registrarIdentidadAnimal
      summary: Registrar identidad animal
      description: Ejecutado en el maestro A. Si la sede es B, la respuesta indica PENDIENTE_CONVERGENCIA
        hasta que la identidad sea visible en B.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sexo
              - identificaciones
              properties:
                sexo:
                  type: string
                  enum:
                  - M
                  - H
                fecha_nacimiento_declarada:
                  type: string
                  format: date
                identificaciones:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - sistema
                    - codigo
                    properties:
                      sistema:
                        type: string
                        enum:
                        - SINIIGA
                        - SINIDA
                        - INTERNO
                        - OTRO
                      codigo:
                        type: string
                        maxLength: 40
                        examples:
                        - DEMO-000123
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - identidad
      operationId: listarAnimales
      summary: listarAnimales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  required:
                  - elementos
                  properties:
                    elementos:
                      type: array
                      items:
                        $ref: '#/components/schemas/Animal'
                    corte:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      - name: q
        in: query
        description: Búsqueda literal acotada; % y _ no actúan como comodines.
        schema:
          type: string
          maxLength: 200
  /sedes/{sedeId}/animales/{animalId}:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - name: animalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - identidad
      operationId: fichaAnimal
      summary: Ficha animal
      responses:
        '200':
          description: Ficha con ciclos históricos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaAnimal'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/operaciones:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    get:
      tags:
      - operaciones
      operationId: bandejaOperaciones
      summary: Bandeja operaciones
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoOperacion'
      - name: tipo
        in: query
        schema:
          type: string
          enum:
          - COMPRA
          - VENTA
      - name: q
        in: query
        description: Búsqueda literal acotada; % y _ no actúan como comodines.
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    elementos:
                      type: array
                      items:
                        $ref: '#/components/schemas/OperacionResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - operaciones
      operationId: crearBorrador
      summary: Crear borrador
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperacionNueva'
      responses:
        '201':
          description: Borrador creado
          headers:
            ETag:
              schema:
                type: string
              description: version_lock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/operaciones/{operacionId}:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - $ref: '#/components/parameters/OperacionId'
    get:
      tags:
      - operaciones
      operationId: obtenerOperacion
      summary: Obtener operacion
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - operaciones
      operationId: editarBorrador
      summary: Editar borrador
      description: Edita lotes, selecciones y condiciones de la versión en curso. Sólo BORRADOR/ACORDADA.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdicionBorrador'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacion'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '412':
          $ref: '#/components/responses/VersionObsoleta'
        '428':
          $ref: '#/components/responses/VersionRequerida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/operaciones/{operacionId}/confirmar:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - $ref: '#/components/parameters/OperacionId'
    post:
      tags:
      - operaciones
      operationId: confirmarOperacion
      summary: Confirmar operacion
      description: ConfirmarCompra o ConfirmarVenta según el tipo (RN-021, RN-022). Atómico.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Confirmada (o resultado previo si es reintento con la misma clave y payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liquidacion'
              examples:
                gold01Compra:
                  value:
                    id: 0192f0a0-0000-7000-8000-000000000001
                    operacion_id: 0192f0a0-0000-7000-8000-0000000000c1
                    direccion: POR_PAGAR
                    total:
                      importe: '240000.00'
                      moneda: MXN
                    saldo:
                      importe: '240000.00'
                      moneda: MXN
                    conceptos:
                    - numero: 1
                      tipo: BASE
                      cantidad: '5000.000'
                      unidad: KG
                      precio_unitario: '48.0000'
                      importe:
                        importe: '240000.00'
                        moneda: MXN
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '412':
          $ref: '#/components/responses/VersionObsoleta'
        '428':
          $ref: '#/components/responses/VersionRequerida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reconocimiento'
  /sedes/{sedeId}/operaciones/{operacionId}/pesajes:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - $ref: '#/components/parameters/OperacionId'
    get:
      tags:
      - pesajes
      operationId: listarPesajesOperacion
      summary: Listar tickets de pesaje de la operación
      description: Tickets con su composición exacta de animales y pesos individuales sólo medidos (RN-012, RN-013). DIV-11.
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    elementos:
                      type: array
                      items:
                        $ref: '#/components/schemas/Pesaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - pesajes
      operationId: proponerPesaje
      summary: Proponer pesaje
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesajeNuevo'
      responses:
        '201':
          description: Propuesto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesaje'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/pesajes/{pesajeId}/aprobar:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - name: pesajeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - pesajes
      operationId: aprobarPesaje
      summary: Aprobar pesaje
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Aprobado y composición congelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesaje'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/pesajes/{pesajeId}/correcciones:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - name: pesajeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - pesajes
      operationId: corregirPesaje
      summary: Corregir pesaje
      description: Crea un nuevo pesaje que corrige al original (no lo edita).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesajeCorreccion'
      responses:
        '201':
          description: Corrección registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/operaciones/{operacionId}/reservas:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - $ref: '#/components/parameters/OperacionId'
    post:
      tags:
      - reservas
      operationId: reservarPosiciones
      summary: Reservar posiciones
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - posiciones
              - vence_en
              properties:
                posiciones:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                vence_en:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Reservas activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '409':
          description: Posición no disponible (otra reserva activa o vendida)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: BV402
                mensaje: La posición ya está reservada por otra venta.
                regla_id: RN-018
                correlation_id: 0192f0a0-0000-7000-8000-00000000ffff
                campos: []
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /sedes/{sedeId}/reservas/{reservaId}/liberar:
    parameters:
    - $ref: '#/components/parameters/SedeId'
    - name: reservaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - reservas
      operationId: liberarReserva
      summary: Liberar reserva
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Liberada
          content:

      summary: Alias obsoleto de /periodos/{periodoId}/cierre
      description: Mismo comando `cerrar_periodo`; se conserva por compatibilidad y ningún cliente del repositorio lo usa (DEC-22). Use `/cierre`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - motivo
              properties:
                motivo:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Resultado persistido del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoComando'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ReglaDominio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          $ref: '#/components/responses/DuenoNoDisponible'
        '400':
          description: Forma o parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: BOVI_SESSION
  parameters:
    SedeId:
      name: sedeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperacionId:
      name: operacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LiquidacionId:
      name: liquidacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PagoId:
      name: pagoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 80
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: version_lock recibido en ETag
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamano:
      name: tamano
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    NoAutenticado:
      description: Sin sesión
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: Sin permiso para la sede o la acción
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: No existe o no es accesible (política uniforme)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Conflicto de concurrencia, version_lock o idempotencia (misma clave, payload distinto)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: BV405
            mensaje: La clave de idempotencia ya se usó con otro contenido.
            regla_id: RN-032
            correlation_id: 0192f0a0-0000-7000-8000-00000000dddd
            campos: []
    ReglaDominio:
      description: Viola una regla de negocio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    DuenoNoDisponible:
      description: Dependencia no disponible; una respuesta perdida puede requerir comprobar resultado
        con la misma clave.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: BV501
            mensaje: La dependencia no está disponible. Compruebe el resultado antes de iniciar otra intención.
            regla_id: RN-041
            correlation_id: 0192f0a0-0000-7000-8000-00000000cccc
            campos: []
    VersionObsoleta:
      description: If-Match no corresponde a la versión revisada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    VersionRequerida:
      description: Falta If-Match obligatorio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ArchivoDemasiadoGrande:
      description: Archivo excede 20 MiB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    TipoArchivoNoAdmitido:
      description: Contenido real de archivo no admitido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Decimal2:
      type: string
      pattern: ^-?\d{1,16}\.\d{2}$
      examples:
      - '240000.00'
    Decimal3:
      type: string
      pattern: ^\d{1,11}\.\d{3}$
      examples:
      - '5000.000'
    Decimal4:
      type: string
      pattern: ^\d{1,10}\.\d{4}$
      examples:
      - '48.0000'
    Dinero:
      type: object
      required:
      - importe
      - moneda
      properties:
        importe:
          $ref: '#/components/schemas/Decimal2'
        moneda:
          type: string
          enum:
          - MXN
    Peso:
      type: object
      required:
      - kg
      properties:
        kg:
          $ref: '#/components/schemas/Decimal3'
    Error:
      type: object
      required:
      - codigo
      - mensaje
      - correlation_id
      properties:
        codigo:
          type: string
          examples:
          - BV402
        mensaje:
          type: string
        regla_id:
          type: string
          examples:
          - RN-018
        correlation_id:
          type: string
          format: uuid
        campos:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              problema:
                type: string
    Pagina:
      type: object
      required:
      - pagina
      - tamano
      - total
      properties:
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    SesionActual:
      type: object
      required:
      - usuario_id
      - nombre
      - sedes
      properties:
        usuario_id: *id001
        nombre:
          type: string
        sedes:
          type: array
          items:
            type: object
            required:
            - id
            - empresa_id
            - codigo
            - nombre
            - roles
            - capacidades
            properties:
              id: *id001
              empresa_id: *id001
              codigo:
                type: string
              nombre:
                type: string
              nodo_dueno:
                type: string
                enum:
                - A
                - B
              roles:
                type: array
                items:
                  type: string
                  enum:
                  - ADMIN
                  - OPERADOR
                  - CAJA
                  - AUDITOR
              capacidades:
                type: array
                items:
                  type: string
    ContraparteNueva:
      type: object
      required:
      - tipo_persona
      - nombre
      properties:
        tipo_persona:
          type: string
          enum:
          - FISICA
          - MORAL
        nombre:
          type: string
          maxLength: 200
        rfc:
          type: string
          maxLength: 13
        telefono:
          type: string
          maxLength: 20
    Contraparte:
      allOf:
      - $ref: '#/components/schemas/ContraparteNueva'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          es_sintetico:
            type: boolean
    Animal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sede_operadora_id:
          type: string
          format: uuid
        situacion:
          type: string
          enum:
          - VIGENTE
          - IDENTIDAD_EN_REVISION
          - MUERTO
        estado_convergencia:
          type: string
          enum:
          - VISIBLE
          - PENDIENTE_CONVERGENCIA
        identificaciones:
          type: array
          items:
            type: object
            properties:
              sistema:
                type: string
              codigo_declarado:
                type: string
              estado:
                type: string
    FichaAnimal:
      allOf:
      - $ref: '#/components/schemas/Animal'
      - type: object
        properties:
          ciclos:
            type: array
            items:
              $ref: '#/components/schemas/Posicion'
    EstadoOperacion:
      type: string
      enum:
      - BORRADOR
      - ACORDADA
      - CONFIRMADA
      - CANCELADA
      - ANULADA
    EstadoPosicion:
      type: string
      enum:
      - PENDIENTE_RECEPCION
      - DISPONIBLE
      - VENDIDA_PENDIENTE_ENTREGA
      - CERRADA_VENTA
      - BAJA
    OperacionResumen:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - COMPRA
          - VENTA
        folio:
          type: string
        contraparte:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoOperacion'
        estado_entrega:
          type: string
          enum:
          - PENDIENTE
          - PARCIAL
          - COMPLETA
        pendientes:
          type: array
          items:
            type: string
            enum:
            - PESAJE
            - LIQUIDACION
            - ENTREGA
            - PAGO
            - DOCUMENTO
    Operacion:
      allOf:
      - $ref: '#/components/schemas/OperacionResumen'
      - type: object
        properties:
          version_lock:
            type: integer
          lotes:
            type: array
            items:
              type: object
              properties:
                numero_lote:
                  type: integer
                animales:
                  type: array
                  items:
                    type: string
                    format: uuid
                posiciones:
                  type: array
                  items:
                    type: string
                    format: uuid
          version_en_curso:
            $ref: '#/components/schemas/Version'
    Version:
      type: object
      properties:
        numero_version:
          type: integer
        estado:
          type: string
          enum:
          - PROPUESTA
          - ACEPTADA
          - SUPERADA
        condiciones:
          type: array
          items:
            type: object
            required:
            - numero_lote
            - unidad_precio
            - precio_unitario
            properties:
              numero_lote:
                type: integer
              unidad_precio:
                type: string
                enum:
                - KG
                - CABEZA
              precio_unitario:
                $ref: '#/components/schemas/Decimal4'
              pesaje_base_id:
                type: string
                format: uuid
              deduccion_pct:
                type: string
                pattern: ^\d{1,2}\.\d{1,6}$
    EdicionBorrador:
      type: object
      required:
      - lotes
      properties:
        lotes:
          type: array
          minItems: 1
          items:
            oneOf:
            - $ref: '#/components/schemas/LoteCompraInput'
            - $ref: '#/components/schemas/LoteVentaInput'
        acordar:
          type: boolean
        requiere_recepcion:
          type: boolean
    PesajeNuevo:
      type: object
      required:
      - numero_lote
      - modo
      - neto
      - pesado_en
      - animales
      properties:
        numero_lote:
          type: integer
        modo:
          type: string
          enum:
          - BRUTO_TARA
          - NETO_REPORTADO
        bruto:
          $ref: '#/components/schemas/Peso'
        tara:
          $ref: '#/components/schemas/Peso'
        neto:
          $ref: '#/components/schemas/Peso'
        ticket_folio:
          type: string
        pesado_en:
          type: string
          format: date-time
        documento_id:
          type: string
          format: uuid
        animales:
          type: array
          items:
            type: object
            required:
            - animal_id
            properties:
              animal_id:
                type: string
                format: uuid
              peso_individual:
                anyOf:
                - $ref: '#/components/schemas/Peso'
                - type: 'null'
                description: Null identifica un peso individual no medido; no se infiere del total.
    PesajeCorreccion:
      allOf:
      - $ref: '#/components/schemas/PesajeNuevo'
      - type: object
        required: [motivo]
        properties:
          motivo:
            type: string
            minLength: 1
            maxLength: 200
            description: Motivo conservado en auditoría; el original se identifica por la ruta.
          corrige_a_id:
            type: string
            format: uuid
            description: Si se envía, debe coincidir con pesajeId de la ruta.
    Pesaje:
      allOf:
      - $ref: '#/components/schemas/PesajeNuevo'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          estado:
            type: string
            enum:
            - PROPUESTA
            - APROBADO
            - CORREGIDO
          motivo_correccion:
            type: [string, 'null']
            maxLength: 200
          corrige_a_id:
            type: [string, 'null']
            format: uuid
          fuente:
            type: string
            enum:
            - MANUAL
            - CSV
            - OCR
            - FDW
    Reserva:
      type: object
      properties:
        id:
          type: string
          format: uuid
        posicion_id:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - ACTIVA
          - CONSUMIDA
          - LIBERADA
          - EXPIRADA
        vence_en:
          type: string
          format: date-time
    Posicion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        animal_id:
          type: string
          format: uuid
        numero_ciclo:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoPosicion'
        reservada:
          type: boolean
          description: Derivado de una reserva ACTIVA
        costo_vigente:
          $ref: '#/components/schemas/Dinero'
    Liquidacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        operacion_id:
          type: string
          format: uuid
        direccion:
          type: string
          enum:
          - POR_PAGAR
          - POR_COBRAR
        total:
          $ref: '#/components/schemas/Dinero'
        ajustes_cargo:
          $ref: '#/components/schemas/Dinero'
        ajustes_abono:
          $ref: '#/components/schemas/Dinero'
        aplicaciones_netas:
          $ref: '#/components/schemas/Dinero'
        saldo:
          $ref: '#/components/schemas/Dinero'
        vence_el:
          type: string
          format: date
        conceptos:
          type: array
          items:
            type: object
            properties:
              numero:
                type: integer
              tipo:
                type: string
                enum:
                - BASE
                - CARGO
                - BONIFICACION
                - DEDUCCION
              cantidad:
                type: string
              unidad:
                type: string
                enum:
                - KG
                - CABEZA
                - MXN
              precio_unitario:
                $ref: '#/components/schemas/Decimal4'
              importe:
                $ref: '#/components/schemas/Dinero'
    GastoNuevo:
      type: object
      required:
      - operacion_id
      - naturaleza
      - clasificacion
      - importe
      - concepto
      - fecha_economica
      - periodo_id
      - fecha_reconocimiento
      properties:
        operacion_id:
          type: string
          format: uuid
        naturaleza:
          type: string
          enum:
          - COSTO
          - BONIFICACION
        clasificacion:
          type: string
          enum:
          - CAPITALIZABLE
          - DIRECTO_VENTA
          - OTRO
        importe:
          $ref: '#/components/schemas/Dinero'
        concepto:
          type: string
          maxLength: 160
        proveedor_parte_id:
          type:
          - string
          - 'null'
          format: uuid
        referencia_origen:
          type:
          - string
          - 'null'
          maxLength: 60
        bonifica_gasto_id:
          type:
          - string
          - 'null'
          format: uuid
        fecha_economica:
          type: string
          format: date
        periodo_id: *id001
        fecha_reconocimiento: *id002
        snapshot_id: *id006
    Asignacion:
      type: object
      properties:
        posicion_id:
          type: string
          format: uuid
        base_valor:
          type: string
        importe:
          $ref: '#/components/schemas/Dinero'
        destino:
          type: string
          enum:
          - INVENTARIO
          - COSTO_VENTA
          - PERDIDA
    PagoNuevo:
      type: object
      required:
      - parte_id
      - tipo
      - importe
      - metodo
      - recibido_el
      properties:
        parte_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - COBRO
          - PAGO
        importe:
          $ref: '#/components/schemas/Dinero'
        metodo:
          type: string
          enum:
          - TRANSFERENCIA
          - EFECTIVO
          - CHEQUE
          - OTRO
        referencia:
          type:
          - string
          - 'null'
          maxLength: 60
        recibido_el:
          type: string
          format: date
    Pago:
      allOf:
      - $ref: '#/components/schemas/PagoNuevo'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          estado:
            type: string
            enum:
            - REGISTRADO
            - VALIDADO
            - REVERTIDO
          disponible:
            $ref: '#/components/schemas/Dinero'
          naturaleza:
            type: string
            enum:
            - NORMAL
            - REEMBOLSO
          periodo_id:
            type:
            - string
            - 'null'
            format: uuid
          fecha_reconocimiento:
            type:
            - string
            - 'null'
            format: date
    Documento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo_documental:
          type: string
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        tamano_bytes:
          type: integer
        mime:
          type: string
        version:
          type: integer
    ReporteCartera:
      type: object
      required: [corte_en, etiqueta, fuente_consulta, antiguedad_replica_segundos, filas, pagina, tamano, total]
      properties:
        corte_en:
          type: string
          format: date-time
        etiqueta:
          type: string
          enum: [ACTUALIZADO]
        fuente_consulta:
          type: string
          enum: [PROPIETARIO, REPLICA]
        antiguedad_replica_segundos:
          type: [integer, 'null']
          description: 0 para lectura propietaria; null si la medida de réplica es desconocida.
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        filas:
          type: array
          items:
            type: object
            required: [liquidacion_id, contraparte, saldo, vence_el, dias_vencida]
            properties:
              liquidacion_id:
                type: string
                format: uuid
              contraparte:
                type: string
              saldo:
                $ref: '#/components/schemas/Dinero'
              vence_el:
                type: [string, 'null']
                format: date
              dias_vencida:
                type: [integer, 'null']
    ReporteMargen:
      type: object
      required: [corte_en, etiqueta, fuente_consulta, antiguedad_replica_segundos, venta_neta, costo_vendido, gastos_directos, margen, perdidas, faltantes]
      properties:
        corte_en:
          type: string
          format: date-time
        etiqueta:
          type: string
          enum: [PROVISIONAL, ACTUALIZADO, CERRADO]
        fuente_consulta:
          type: string
          enum: [PROPIETARIO, REPLICA]
        antiguedad_replica_segundos:
          type: [integer, 'null']
          description: 0 para lectura propietaria; null si la medida de réplica es desconocida.
        venta_neta:
          $ref: '#/components/schemas/Dinero'
        costo_vendido:
          $ref: '#/components/schemas/Dinero'
        gastos_directos:
          $ref: '#/components/schemas/Dinero'
        margen:
          $ref: '#/components/schemas/Dinero'
        perdidas:
          $ref: '#/components/schemas/Dinero'
        faltantes:
          type: array
          items:
            type: string
    TarifaExterna:
      type: object
      properties:
        fuente:
          type: string
          examples:
          - Proveedor Simulado (sintético)
        ruta:
          type: string
        precio:
          $ref: '#/components/schemas/Decimal4'
        unidad:
          type: string
        vigente_desde:
          type: string
          format: date
        version:
          type: integer
    Csrf:
      type: object
      required:
      - token
      - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
    Reconocimiento:
      type: object
      required:
      - periodo_id
      - fecha_reconocimiento
      properties:
        periodo_id: *id001
        fecha_reconocimiento: *id002
    LoteCompraInput:
      type: object
      required:
      - numero_lote
      - animales
      - unidad_precio
      - precio_unitario
      properties:
        numero_lote: &id007
          type: integer
          minimum: 1
        descripcion: &id008
          type: string
          maxLength: 120
        animales:
          type: array
          minItems: 1
          uniqueItems: true
          items: *id001
        unidad_precio: &id009
          type: string
          enum:
          - KG
          - CABEZA
        precio_unitario: &id010
          $ref: '#/components/schemas/Decimal4'
        pesaje_base_id: *id001
        deduccion_pct: &id011
          type: string
          pattern: ^\d{1,2}\.\d{1,6}$
        cargos_pactados: &id012
          $ref: '#/components/schemas/Decimal2'
        bonificaciones_pactadas: &id013
          $ref: '#/components/schemas/Decimal2'
    LoteVentaInput:
      type: object
      required:
      - numero_lote
      - posiciones
      - unidad_precio
      - precio_unitario
      properties:
        numero_lote: *id007
        descripcion: *id008
        unidad_precio: *id009
        precio_unitario: *id010
        pesaje_base_id: *id001
        deduccion_pct: *id011
        cargos_pactados: *id012
        bonificaciones_pactadas: *id013
        posiciones:
          type: array
          minItems: 1
          uniqueItems: true
          items: *id001
    DistribucionInput:
      type: object
      required:
      - metodo
      - periodo_id
      - fecha_reconocimiento
      properties:
        metodo:
          type: string
          enum:
          - POR_CABEZA
          - POR_PESO_MEDIDO
          - IMPORTE_INDIVIDUAL
        periodo_id: *id001
        fecha_reconocimiento:
          type: string
          format: date
        asignaciones:
          type: array
          items:
            type: object
            required:
            - posicion_id
            - importe
            properties:
              posicion_id: *id001
              importe:
                $ref: '#/components/schemas/Decimal2'
    Gasto:
      allOf:
      - $ref: '#/components/schemas/GastoNuevo'
      - type: object
        required: []
        properties:
          gasto_id: *id001
          estado:
            type: string
            enum:
            - BORRADOR
            - APROBADO
    ResultadoComando:
      type: object
      properties:
        id: *id004
        version_lock:
          type: integer
          minimum: 0
    OperacionNueva:
      type: object
      required:
      - tipo
      - parte_id
      - fecha_operacion
      properties:
        tipo:
          type: string
          enum:
          - COMPRA
          - VENTA
        parte_id:
          type: string
          format: uuid
        fecha_operacion:
          type: string
          format: date
        requiere_recepcion:
          type: boolean
          default: false
          description: 'En compra: conserva la posición pendiente de recepción física cuando es true.'
        lotes:
          type: array
          minItems: 1
          items:
            oneOf:
            - $ref: '#/components/schemas/LoteCompraInput'
            - $ref: '#/components/schemas/LoteVentaInput'
    Usuario:
      type: object
      required:
      - id
      - nombre
      - login
      - estado
      properties:
        id: *id004
        nombre: *id005
        login: *id005
        estado:
          type: string
          enum:
          - ACTIVO
          - BLOQUEADO
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - OPERADOR
            - CAJA
            - AUDITOR
    UsuarioNuevo:
      type: object
      required:
      - login
      - nombre
      - contrasena
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 100
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        contrasena:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: Máximo 72 bytes UTF-8 para bcrypt; no se devuelve.
    Periodo:
      type: object
      required:
      - id
      - desde
      - hasta
      - estado
      properties:
        id: *id004
        fecha_inicio: *id003
        fecha_fin: *id003
        estado:
          type: string
          enum:
          - ABIERTO
          - CERRADO
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
    Predio:
      type: object
      required:
      - id
      - nombre
      properties:
        id: *id004
        nombre: *id005
        municipio: *id005
        entidad_federativa: *id005
        parte_responsable_id: *id004
    PredioNuevo:
      type: object
      required:
      - nombre
      properties:
        nombre: *id005
        municipio: *id005
        entidad_federativa: *id005
        parte_responsable_id: *id004
        clave_upp_declarada: *id005
    CierreVersion:
      type: object
      required:
      - numero_version
      - periodo_id
      properties:
        numero_version:
          type: integer
        periodo_id: *id004
        totales:
          type: object
          additionalProperties: true
        corte_en:
          type: string
          format: date-time
        tipo:
          type: string
          enum:
          - CIERRE
          - REAPERTURA
    CalculoLote:
      type: object
      properties:
        numero_lote:
          type: integer
        cantidad:
          type: string
        unidad:
          type: string
          enum:
          - KG
          - CABEZA
        precio:
          $ref: '#/components/schemas/Decimal4'
        base:
          $ref: '#/components/schemas/Dinero'
        total:
          $ref: '#/components/schemas/Dinero'
    TarifaCapturada:
      allOf:
      - $ref: '#/components/schemas/TarifaExterna'
      - type: object
        required:
        - snapshot_id
        - hash_sha256
        - fuente
        - ruta
        - precio
        - unidad
        - capturado_en
        properties:
          snapshot_id: *id006
          hash_sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
          fuente:
            type: string
            enum:
            - DEMO_PROVEEDOR_SIMULADO
          ruta:
            type: string
          precio:
            $ref: '#/components/schemas/Dinero'
          unidad:
            type: string
          version:
            type: integer
          capturado_en:
            type: string
            format: date-time
    DiagnosticoProceso:
      type: object
      required:
      - proceso
      - comandos
      - consultas
      - pools
      - sincronizacion
      - capturado_en
      properties:
        proceso:
          type: object
          required:
          - iniciado_en
          - contadores_se_reinician
          properties:
            iniciado_en:
              type: string
              format: date-time
            contadores_se_reinician:
              type: boolean
              const: true
        comandos:
          type: object
          required:
          - completados
          - errores
          - duracion_total_ms
          properties:
            completados: &id014
              type: integer
              minimum: 0
            errores: *id014
            duracion_total_ms: *id014
        consultas:
          type: object
          required:
          - total
          - errores
          - lentas
          - umbral_lenta_ms
          - duracion_total_ms
          properties:
            total: *id014
            errores: *id014
            lentas: *id014
            umbral_lenta_ms: *id014
            duracion_total_ms: *id014
        pools:
          type: object
          additionalProperties:
            type: object
            required:
            - activos
            - inactivos
            - esperando
            - maximo
            properties:
              activos: *id014
              inactivos: *id014
              esperando: *id014
              maximo: *id014
        sincronizacion:
          type: object
          description: 'Estado SQL observado; antigüedad desconocida se mantiene null. Si falla dependencia:
            estadoNO_DISPONIBLE y código público.'
        capturado_en:
          type: string
          format: date-time

# Override local después de bootstrap/migración; no publica imágenes ni puertos públicos.
services:
  backend:
    image: bovicierre-backend:local
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    user: '${BOVI_UID:-1000}:${BOVI_GID:-1000}'
    environment:
      BOVI_BIND_ADDRESS: 0.0.0.0
      BOVI_DB_A_URL: jdbc:postgresql://pgpool-a:9999/bovicierre
      BOVI_DB_B_URL: jdbc:postgresql://pgpool-b:9999/bovicierre
      BOVI_AUTH_URL: jdbc:postgresql://pg-a:5432/bovicierre
      BOVI_DB_A_PASSWORD_FILE: /run/secrets/app_a_password
      BOVI_DB_B_PASSWORD_FILE: /run/secrets/app_b_password
      BOVI_AUTH_PASSWORD_FILE: /run/secrets/auth_password
      BOVI_WORKER_PASSWORD_FILE: /run/secrets/worker_password
      BOVI_DOCUMENTS_DIR: /private-documents
    secrets: [app_a_password, app_b_password, auth_password, worker_password]
    volumes: ['${BOVI_PRIVATE_DIR:?Define directorio privado externo}/private-documents:/private-documents']
    depends_on: [pgpool-a, pgpool-b]
    stop_grace_period: 40s
    mem_limit: 1g
  frontend:
    image: bovicierre-frontend:local
    build:
      context: ../../frontend
    user: '${BOVI_UID:-1000}:${BOVI_GID:-1000}'
    mem_limit: 128m
  caddy:
    build: ../caddy
    image: bovicierre-caddy:local
    user: '${BOVI_UID:-1000}:${BOVI_GID:-1000}'
    ports: ['127.0.0.1:15180:8080']
    volumes: ['../caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro']
    read_only: true
    tmpfs: ['/tmp:uid=1000,gid=1000,mode=0700', '/data:uid=1000,gid=1000,mode=0700', '/config:uid=1000,gid=1000,mode=0700']
    depends_on: [backend, frontend]
    mem_limit: 128m
secrets:
  auth_password: {file: '${BOVI_SECRET_DIR}/auth_password'}

name: Verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: python3 tools/verificar_cobertura.py
      - run: python3 tools/esquema/esquema.py
      - run: python3 -m unittest discover -s tools/diagramas -p 'test_*.py'
      - run: npx -y @redocly/cli@1.34.5 lint docs/api/openapi.yaml
      - run: ./backend/mvnw -B -q -f backend/pom.xml test
        env:
          BOVI_TC_IT: 'true'
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
